<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Group Scraper Dashboard</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; color: #1c1e21; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .config-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Token and URL input styling */
        .input-wrapper { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; font-family: monospace; font-size: 12px; box-sizing: border-box; resize: vertical; }
        
        .token-row { display: flex; gap: 10px; align-items: center; }
        input[type="password"], input[type="text"].token-input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #f0f2f5; pt: 15px; padding-top: 15px; }
        button { padding: 10px 25px; background: #1877f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #166fe5; }
        
        .post-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid #ddd; position: relative; }
        .post-meta { display: flex; justify-content: space-between; color: #65676b; font-size: 11px; margin-bottom: 8px; border-bottom: 1px solid #f0f2f5; padding-bottom: 5px; }
        .post-text { margin: 10px 0; white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
        
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .image-grid img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; border: 1px solid #e4e6eb; transition: transform 0.2s; }
        .image-grid img:hover { transform: scale(1.02); }
        
        .status-bar { font-size: 13px; color: #65676b; }
        .badge { background: #e4e6eb; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .post-meta a:hover { text-decoration: underline !important; }
        .post-meta div { display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="config-panel">
        <div class="input-wrapper">
            <label>GitHub Personal Access Token (PAT):</label>
            <div class="token-row">
                <input type="password" id="tokenInput" class="token-input" placeholder="ghp_xxxxxxxxxxxx">
                <button onclick="toggleToken()" style="background: #e4e6eb; color: #050505; padding: 10px 15px;">👁</button>
            </div>
            <small style="color: #65676b;">Adding a token increases your rate limit to 5,000 requests/hr.</small>
        </div>

        <div class="input-wrapper">
            <label>Gist Raw URLs (One per line):</label>
            <textarea id="urlInput" placeholder="https://gist.githubusercontent.com/.../raw/posts_xxx.json"></textarea>
        </div>

        <div class="controls">
            <div class="status-bar">
                <span id="status">Ready</span> • <span id="timestamp"></span>
            </div>
            <button onclick="saveAndFetch()">Save & Sync</button>
        </div>
    </div>

    <div id="feed"></div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const tokenInput = document.getElementById('tokenInput');
    const status = document.getElementById('status');
    const timestamp = document.getElementById('timestamp');
    const feed = document.getElementById('feed');

    window.onload = () => {
        const savedUrls = localStorage.getItem('multi_gist_urls');
        const savedToken = localStorage.getItem('gh_token');
        if (savedUrls) urlInput.value = savedUrls;
        if (savedToken) tokenInput.value = savedToken;
        if (savedUrls) fetchAllGists();
    };

    function toggleToken() {
        tokenInput.type = tokenInput.type === "password" ? "text" : "password";
    }

    function saveAndFetch() {
        localStorage.setItem('multi_gist_urls', urlInput.value.trim());
        localStorage.setItem('gh_token', tokenInput.value.trim());
        fetchAllGists();
    }

    async function fetchAllGists() {
        const urls = urlInput.value.split('\n').map(u => u.trim()).filter(u => u.length > 0);
        const token = tokenInput.value.trim();
        if (urls.length === 0) return;
        
        status.innerText = "Syncing...";
        let allPosts = [];
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (token) headers['Authorization'] = `token ${token}`;

        try {
            for (const url of urls) {
                // Fetch the Gist metadata
                const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}t=${Date.now()}`, { headers });
                const gistData = await response.json();

                // Check if this is a Gist API response (contains a 'files' object)
                if (gistData.files) {
                    Object.keys(gistData.files).forEach(fileName => {
                        const file = gistData.files[fileName];
                        
                        // Only process .json files
                        if (fileName.endsWith('.json')) {
                            try {
                                // Extract Group ID from filename (e.g., posts_12345.json -> 12345)
                                const groupIdMatch = fileName.match(/posts_(.+)\.json/);
                                const groupId = groupIdMatch ? groupIdMatch[1] : "unknown";

                                // Parse the 'content' string into a real array
                                const posts = JSON.parse(file.content);
                                
                                if (Array.isArray(posts)) {
                                    posts.forEach(p => allPosts.push({ ...p, groupId }));
                                }
                            } catch (e) {
                                console.warn(`Could not parse file: ${fileName}`, e);
                            }
                        }
                    });
                } else if (Array.isArray(gistData)) {
                    // Fallback for Raw URLs that return direct arrays
                    allPosts.push(...gistData);
                }
            }

            // Sort by newest first
            allPosts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderPosts(allPosts);
            
            status.innerText = `Connected • ${allPosts.length} posts from ${urls.length} source(s)`;
            status.style.color = "green";
            timestamp.innerText = `Last sync: ${new Date().toLocaleTimeString()}`;
        } catch (err) {
            console.error(err);
            status.innerText = "Sync Error: Check Console";
            status.style.color = "red";
        }
    }

    function renderPosts(posts) {
        feed.innerHTML = ''; 
        if (posts.length === 0) {
            feed.innerHTML = "<div style='padding:20px; text-align:center;'>No posts found. Ensure filenames start with 'posts_'.</div>";
            return;
        }

        posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            const postDate = post.timestamp ? new Date(post.timestamp).toLocaleString() : "Unknown date";
            const fbUrl = `https://www.facebook.com/groups/${post.groupId}/posts/${post.id}/`;

            const imagesHtml = (post.images || []).map(src => `
                <a href="${src}" target="_blank"><img src="${src}" loading="lazy" onerror="this.style.display='none'"></a>
            `).join('');

            card.innerHTML = `
                <div class="post-meta">
                    <span>Group: <span class="badge">${post.groupId}</span></span>
                    <div>
                        <span style="margin-right:10px;">${postDate}</span>
                        <a href="${fbUrl}" target="_blank" style="color: #1877f2; text-decoration: none; font-weight: bold;">View ↗</a>
                    </div>
                </div>
                <div class="post-text">${post.text || ""}</div>
                <div class="image-grid">${imagesHtml}</div>
            `;
            feed.appendChild(card);
        });
    }

    // Auto-refresh every 60 seconds
    setInterval(() => {
        if (document.visibilityState === 'visible' && urlInput.value.trim()) {
            fetchAllGists();
        }
    }, 60000);
</script>

</body>
</html>
