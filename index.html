<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper Dashboard</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; color: #1c1e21; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Configuration Header */
        .config-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { padding: 10px 20px; background: #1877f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #166fe5; }
        
        /* Feed Styling */
        .post-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .post-id { color: #65676b; font-size: 11px; font-family: monospace; margin-bottom: 8px; }
        .post-text { margin: 10px 0; white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .image-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; border: 1px solid #e4e6eb; }
        
        .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: #65676b; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="config-panel">
        <label style="font-weight: bold;">Gist Raw JSON URL:</label>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://gist.githubusercontent.com/.../raw/posts_xxx.json">
            <button onclick="saveAndFetch()">Load Feed</button>
        </div>
        <div class="status-bar">
            <span id="status">Enter a URL to start</span>
            <span id="timestamp"></span>
        </div>
    </div>

    <div id="feed">
        <!-- Posts will appear here -->
    </div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const status = document.getElementById('status');
    const timestamp = document.getElementById('timestamp');
    const feed = document.getElementById('feed');

    // 1. On Load: Check if we have a URL saved in the browser
    window.onload = () => {
        const savedUrl = localStorage.getItem('last_gist_url');
        if (savedUrl) {
            urlInput.value = savedUrl;
            fetchPosts(savedUrl);
        }
    };

    // 2. Save URL to localStorage and trigger fetch
    function saveAndFetch() {
        const url = urlInput.value.trim();
        if (!url) {
            alert("Please enter a valid Gist Raw URL");
            return;
        }
        localStorage.setItem('last_gist_url', url);
        fetchPosts(url);
    }

    // 3. Fetch data from GitHub
    async function fetchPosts(url) {
        status.innerText = "Fetching data...";
        status.style.color = "#1877f2";

        try {
            // Cache-busting: adds timestamp so GitHub doesn't serve an old version
            const response = await fetch(`${url}?t=${Date.now()}`);
            if (!response.ok) throw new Error("Could not load Gist");

            const posts = await response.json();
            renderPosts(posts);

            status.innerText = `Connected: ${posts.length} posts found`;
            status.style.color = "green";
            timestamp.innerText = `Last sync: ${new Date().toLocaleTimeString()}`;
        } catch (err) {
            console.error(err);
            status.innerText = "Error: Invalid URL or GitHub Cache issue";
            status.style.color = "red";
            feed.innerHTML = `<div style="text-align:center; padding: 20px;">Ensure the URL is a <b>Raw</b> Gist link and includes "raw" in the address.</div>`;
        }
    }

    // 4. Build the HTML cards
    function renderPosts(posts) {
        feed.innerHTML = ''; 
        
        if (posts.length === 0) {
            feed.innerHTML = "No posts found in this file.";
            return;
        }

        posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            
            const imagesHtml = (post.images || []).map(src => `
                <a href="${src}" target="_blank">
                    <img src="${src}" loading="lazy">
                </a>
            `).join('');

            card.innerHTML = `
                <div class="post-id">ID: ${post.id}</div>
                <div class="post-text">${post.text || "<em>No text content</em>"}</div>
                <div class="image-grid">${imagesHtml}</div>
            `;
            feed.appendChild(card);
        });
    }

    // Optional: Auto-refresh every 60 seconds if a URL is active
    setInterval(() => {
        const currentUrl = localStorage.getItem('last_gist_url');
        if (currentUrl) fetchPosts(currentUrl);
    }, 60000);

</script>

</body>
</html>
